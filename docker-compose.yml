version: "3.8"

services:
  paylens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paylens-solo
    ports:
      - "8501:8501"
    environment:
      - AMD_VLLM_BASE_URL=${AMD_VLLM_BASE_URL:-}
      - AMD_TOKENFACTORY_BASE_URL=${AMD_TOKENFACTORY_BASE_URL:-}
      - AMD_API_KEY=${AMD_API_KEY:-}
      - MODEL_NAME=${MODEL_NAME:-}
      - DUCKDB_PATH=data/generated/paylens.duckdb
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
    restart: unless-stopped
